name: Build and Release Music API (Standalone)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Single File
        run: |
          npm run build
          mv dist/index.js dist/app.js
          cd dist && zip -r ../music-api-dist.zip app.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Music API Release ${{ github.ref_name || 'v1.0.0' }}
          files: music-api-dist.zip
          draft: false
          prerelease: false
